<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bütçem">
<link rel="manifest" href="manifest.json">
<title>Bütçem</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--text:#111827;--muted:#6b7280;--line:#e5e7eb;--accent:#2563eb;--good:#059669;--bad:#dc2626}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--text)}
.app{max-width:760px;margin:auto;padding:18px 14px 90px}.top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}h1{margin:0;font-size:27px}
.monthnav,.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.monthnav{margin-top:7px}.month{min-width:125px;text-align:center;color:var(--muted);font-size:14px;font-weight:600}
button{border:0;border-radius:13px;padding:11px 13px;font-size:15px}.primary{background:var(--accent);color:white;font-weight:700}.ghost{background:white;border:1px solid var(--line)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:15px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px}.label,.small{color:var(--muted);font-size:12px}.value{font-size:21px;font-weight:750;margin-top:5px}.good{color:var(--good)}.bad{color:var(--bad)}
.section{margin-top:13px}.section h2{font-size:17px;margin:0 0 10px}.list{display:flex;flex-direction:column;gap:8px}.item{background:#fff;border:1px solid var(--line);border-radius:14px;padding:11px;display:flex;justify-content:space-between;gap:10px;align-items:center}.meta{font-size:12px;color:var(--muted);margin-top:3px}.amount{font-weight:700;white-space:nowrap}
.progress{height:11px;background:#e5e7eb;border-radius:99px;overflow:hidden;margin-top:8px}.progress span{display:block;height:100%;background:var(--accent)}
.barrow{display:grid;grid-template-columns:100px 1fr auto;gap:8px;align-items:center;margin:8px 0}.bar{height:9px;background:#eef2f7;border-radius:99px;overflow:hidden}.bar span{display:block;height:100%;background:var(--accent)}
dialog{border:0;border-radius:22px;padding:0;width:min(94vw,520px);box-shadow:0 24px 70px rgba(0,0,0,.25)}dialog::backdrop{background:rgba(0,0,0,.35)}form{padding:18px}form h3{margin-top:0}
label{display:block;font-size:13px;color:var(--muted);margin:10px 0 5px}input,select,textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;font-size:16px;background:white}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:16px}
.backupbox{border:1px solid var(--line);border-radius:15px;padding:12px;margin-top:12px}.status{font-size:13px;margin-top:7px;color:var(--muted)}.fab{position:fixed;right:18px;bottom:20px;border-radius:999px;padding:15px 19px;box-shadow:0 12px 30px rgba(0,0,0,.18)}
@media(max-width:480px){.row{grid-template-columns:1fr}.barrow{grid-template-columns:85px 1fr auto}}
</style>
</head>
<body>
<div class="app">
<div class="top"><div><h1>Bütçem</h1><div class="monthnav"><button id="prev" class="ghost">‹</button><div id="monthLabel" class="month"></div><button id="next" class="ghost">›</button></div></div><button id="settingsBtn" class="ghost">Ayarlar</button></div>

<div class="grid">
<div class="card"><div class="label">Harcama</div><div id="expenseTotal" class="value bad">₺0</div></div>
<div class="card"><div class="label">Gelir</div><div id="incomeTotal" class="value good">₺0</div></div>
<div class="card"><div class="label">Net durum</div><div id="netTotal" class="value">₺0</div></div>
<div class="card"><div class="label">Kalan bütçe</div><div id="remaining" class="value">—</div></div>
</div>

<div class="section card"><div style="display:flex;justify-content:space-between"><div><div class="label">Aylık bütçe</div><div id="budgetText" style="font-weight:700;margin-top:4px">Belirlenmedi</div></div><div id="budgetPct">0%</div></div><div class="progress"><span id="budgetBar" style="width:0%"></span></div></div>

<div class="section card"><h2>Aylık karşılaştırma</h2><div id="compare" style="font-weight:700"></div><div id="insights" class="list" style="margin-top:10px"></div></div>

<div class="section toolbar"><button id="expenseBtn" class="primary">+ Harcama</button><button id="incomeBtn" class="ghost">+ Gelir</button></div>

<div class="section card"><h2>Kategoriler</h2><div id="categories"></div></div>
<div class="section card"><h2>Son işlemler</h2><div id="transactions" class="list"></div></div>
</div>
<button id="fab" class="primary fab">+ Harcama</button>

<dialog id="txnDialog"><form id="txnForm">
<h3 id="txnTitle">Harcama ekle</h3><input id="txnType" type="hidden">
<label>Tutar</label><input id="amount" type="number" min="0.01" step="0.01" required inputmode="decimal">
<div class="row"><div><label>Kategori</label><select id="category"></select></div><div><label>Ödeme</label><select id="payment"><option>Nakit</option><option>Kredi Kartı</option><option>Banka Kartı</option><option>Havale / EFT</option></select></div></div>
<label>Açıklama</label><input id="description" maxlength="100">
<label>Tarih</label><input id="date" type="date" required>
<div class="actions"><button type="button" id="cancelTxn" class="ghost">Vazgeç</button><button class="primary">Kaydet</button></div>
</form></dialog>

<dialog id="settingsDialog"><form id="settingsForm">
<h3>Ayarlar ve verilerim</h3>
<label>Aylık bütçe</label><input id="monthlyBudget" type="number" min="0" step="100">
<label>Kategoriler</label><textarea id="categoriesText" rows="4"></textarea>
<div class="backupbox">
<strong>Veri güvenliği</strong>
<div class="status" id="backupStatus">Kayıtların bu cihazda saklanıyor.</div>
<div class="toolbar" style="margin-top:10px">
<button type="button" id="fullBackupBtn" class="primary">Tam yedek indir</button>
<button type="button" id="restoreBtn" class="ghost">Yedeği geri yükle</button>
<button type="button" id="csvImportBtn" class="ghost">Eski CSV’yi içe aktar</button>
<button type="button" id="csvBtn" class="ghost">CSV dışa aktar</button>
</div>
<input id="restoreFile" type="file" accept=".json,application/json" style="display:none">
<input id="csvImportFile" type="file" accept=".csv,text/csv" style="display:none">
</div>
<div class="actions"><button type="button" id="cancelSettings" class="ghost">Vazgeç</button><button class="primary">Ayarları kaydet</button></div>
</form></dialog>
<script src="app.js"></script>
</body></html>
